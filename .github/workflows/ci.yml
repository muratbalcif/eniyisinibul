name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @eib/database exec prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/eniyisinibul?schema=public
      - run: pnpm --filter @eib/database db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/eniyisinibul?schema=public
      - run: pnpm build
