name: eniyisinibul
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eniyisinibul
      POSTGRES_USER: eib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - eib_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eib -d eniyisinibul']
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  eib_postgres:
